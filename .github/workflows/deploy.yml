name: Build and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install LibreOffice (needed for legacy .xls conversion)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc

      - name: Extract downloaded archives
        run: PYTHONPATH=src python3 src/prepare_inbox.py

      - name: Ingest raw files and reconcile
        run: |
          PYTHONPATH=src python3 src/pipeline.py ingest
          PYTHONPATH=src python3 src/pipeline.py reconcile
          PYTHONPATH=src python3 src/load_db.py

      - name: Build static site
        run: PYTHONPATH=src python3 src/build_site.py

      - name: Validate outputs
        run: |
          PYTHONPATH=src python3 tests/validate_site.py
          PYTHONPATH=src python3 tests/validate_sqlite.py
          PYTHONPATH=src python3 tests/validate_report.py
          node --check site/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
