services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keproba}
      POSTGRES_USER: ${POSTGRES_USER:-keproba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: psql/bootstrap need host access, but the DB stays off the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/01_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keproba}"]
      interval: 10s
      retries: 5

  metabase:
    image: metabase/metabase:v0.64.1
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: ${POSTGRES_USER:-keproba}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?set MB_ENCRYPTION_SECRET_KEY in .env}
      JAVA_OPTS: "-Xmx2g"
      MB_SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      # Loopback only: metabase/bootstrap.py uses MB_URL=http://localhost:3000.
      # Public access goes through Caddy on 80/443, never directly to 3000.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mbdata:/metabase-data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - metabase

volumes:
  pgdata:
  mbdata:
  caddydata:
  caddyconfig:
